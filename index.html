<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm Danh BOSS - TGDD</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}

.header{
  background:#ffd400;
  padding:14px 16px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #999;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.title{
  font-size:24px;
  font-weight:900;
  margin-top:5px;
}

.clock{
  font-size:13px;
  font-weight:bold;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:8px;
  white-space:nowrap;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:15px;
}

.toolbar{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
  margin-bottom:14px;
}

.search{
  width:100%;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#ffd400;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  gap:10px;
  flex-wrap:wrap;
}

.count{
  font-weight:bold;
}

.admin-btn{
  background:#111;
  color:#fff;
  border:0;
  padding:9px 13px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.admin-btn:hover{
  opacity:.85;
}

.admin-panel{
  display:none;
  background:#fff;
  border:2px solid #ffd400;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #ddd;
}

.admin-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.btn{
  border:0;
  padding:11px 10px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  background:#111;
  color:#fff;
}

.btn.yellow{
  background:#ffd400;
  color:#111;
}

.btn.red{
  background:#d60000;
  color:#fff;
}

.btn.green{
  background:#198754;
  color:#fff;
}

.btn.blue{
  background:#0d6efd;
  color:#fff;
}

.file-label{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:11px;
  border-radius:9px;
  background:#ffd400;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.file-label input{
  display:none;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.card{
  background:#fff;
  border-radius:13px;
  padding:12px;
  box-shadow:0 2px 6px #ddd;
  border-left:5px solid #ffd400;
}

.card.checked{
  border-left-color:#198754;
  background:#f1fff6;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.person{
  min-width:0;
  flex:1;
}

.name{
  font-size:17px;
  font-weight:900;
  margin-bottom:3px;
}

.user{
  font-size:12px;
  color:#666;
  font-weight:bold;
}

.store{
  font-size:13px;
  margin-top:6px;
  color:#333;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.province{
  display:inline-block;
  margin-top:5px;
  background:#eee;
  border-radius:5px;
  padding:3px 6px;
  font-size:11px;
  font-weight:bold;
}

.check-btn{
  min-width:105px;
  border:0;
  padding:10px 8px;
  border-radius:9px;
  background:#ffd400;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

.check-btn.done{
  background:#198754;
  color:#fff;
}

.check-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.time{
  font-size:11px;
  color:#198754;
  font-weight:bold;
  margin-top:5px;
}

.admin-actions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-btn{
  border:0;
  padding:6px 9px;
  border-radius:6px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.edit{
  background:#111;
  color:#fff;
}

.delete{
  background:#e00000;
  color:#fff;
}

.empty{
  background:#fff;
  border-radius:12px;
  padding:30px;
  text-align:center;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  font-weight:bold;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  background:#fff;
  width:100%;
  max-width:460px;
  border-radius:15px;
  padding:18px;
}

.modal h2{
  margin-bottom:12px;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  margin-bottom:9px;
  font-size:15px;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.modal-buttons button{
  flex:1;
}

.status{
  text-align:center;
  padding:8px;
  font-size:13px;
  font-weight:bold;
  color:#555;
}

.admin-on{
  background:#198754;
  color:#fff;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

@media(max-width:600px){
  .title{
    font-size:20px;
  }

  .clock{
    font-size:11px;
  }

  .admin-grid{
    grid-template-columns:1fr;
  }

  .name{
    font-size:16px;
  }

  .check-btn{
    min-width:95px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div>
      <div class="logo">THẾ GIỚI DI ĐỘNG</div>
      <div class="title">BẢNG ĐIỂM DANH BOSS</div>
    </div>

    <div id="clock" class="clock">--:--:--</div>
  </div>
</header>

<div class="container">

  <div class="toolbar">
    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Tìm BOSS, User, siêu thị..."
      oninput="render()"
    >

    <div class="info">
      <div id="count" class="count">Đang tải...</div>

      <div>
        <span id="adminStatus"></span>
        <button class="admin-btn" onclick="openAdmin()">⚙ ADMIN</button>
      </div>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel">

    <div class="admin-title">
      ⚙ QUẢN LÝ DANH SÁCH
    </div>

    <div class="admin-grid">

      <label class="file-label">
        📥 NHẬP FILE EXCEL
        <input
          id="excelFile"
          type="file"
          accept=".xlsx,.xls,.csv"
          onchange="importExcel(event)"
        >
      </label>

      <button class="btn green" onclick="exportExcel()">
        📤 XUẤT EXCEL
      </button>

      <button class="btn yellow" onclick="openAdd()">
        ＋ THÊM BOSS
      </button>

      <button class="btn blue" onclick="clearAllAttendance()">
        🔄 XÓA ĐIỂM DANH
      </button>

      <button class="btn red" onclick="logoutAdmin()">
        🚪 THOÁT ADMIN
      </button>

    </div>

    <div id="adminMessage" class="status"></div>

  </div>

  <div id="list" class="list">
    <div class="loading">⏳ Đang kết nối...</div>
  </div>

</div>


<!-- LOGIN ADMIN -->
<div id="loginModal" class="modal-bg">

  <div class="modal">

    <h2>🔐 ĐĂNG NHẬP ADMIN</h2>

    <input
      id="adminPassword"
      class="input"
      type="password"
      placeholder="Nhập mật khẩu Admin"
      onkeydown="if(event.key==='Enter') loginAdmin()"
    >

    <div class="modal-buttons">
      <button class="btn" onclick="closeModal('loginModal')">
        HỦY
      </button>

      <button class="btn yellow" onclick="loginAdmin()">
        ĐĂNG NHẬP
      </button>
    </div>

  </div>

</div>


<!-- ADD / EDIT -->
<div id="bossModal" class="modal-bg">

  <div class="modal">

    <h2 id="bossModalTitle">＋ THÊM BOSS</h2>

    <input id="bossId" class="input" placeholder="User / BOSS - VD: 146155 - Đời">

    <input id="bossName" class="input" placeholder="Tên hiển thị">

    <input id="bossProvince" class="input" placeholder="Tỉnh - VD: BẠC LIÊU">

    <input id="bossStore" class="input" placeholder="Siêu thị - VD: 976 - Hộ Phòng">

    <div class="modal-buttons">

      <button class="btn" onclick="closeModal('bossModal')">
        HỦY
      </button>

      <button class="btn yellow" onclick="saveBoss()">
        LƯU
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyB-xKXuZaAiHyjGn29fXZwG8QlJ-j0N-mY",
  authDomain: "diemdanhbosstgdd.firebaseapp.com",
  databaseURL: "https://diemdanhbosstgdd-default-rtdb.firebaseio.com",
  projectId: "diemdanhbosstgdd",
  storageBucket: "diemdanhbosstgdd.firebasestorage.app",
  messagingSenderId: "146132929007",
  appId: "1:146132929007:web:dff23161237955eaf1ce1a",
  measurementId: "G-HW16YQR03B"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL = "admin@tgddhopphong.com";

let admin = false;
let currentEditKey = null;


/* =========================================================
   DATA
========================================================= */

let roster = {};
let attendance = {};


/* =========================================================
   NGÀY VIỆT NAM
========================================================= */

function todayKey(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


/* =========================================================
   FORMAT THỜI GIAN
========================================================= */

function formatTime(timestamp){

  if(!timestamp) return "";

  const d = new Date(timestamp);

  return d.toLocaleString("vi-VN",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });

}


/* =========================================================
   ĐỒNG HỒ
========================================================= */

function updateClock(){

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleString("vi-VN",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });

}

setInterval(updateClock,1000);
updateClock();


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user => {

  if(user){

    admin = user.email === ADMIN_EMAIL;

    updateAdminUI();

    await loadData();

  }else{

    admin = false;

    updateAdminUI();

    try{

      await auth.signInAnonymously();

    }catch(error){

      console.error(error);

      document.getElementById("list").innerHTML =
        `<div class="empty">
          ❌ Không thể kết nối hệ thống.<br>
          Vui lòng kiểm tra Firebase.
        </div>`;

    }

  }

});


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{

    const rosterSnap = await db.ref("roster").once("value");

    roster = rosterSnap.val() || {};

    const attendanceSnap =
      await db.ref("attendance/" + todayKey()).once("value");

    attendance = attendanceSnap.val() || {};

    render();

  }catch(error){

    console.error(error);

    document.getElementById("list").innerHTML =
      `<div class="empty">
        ❌ Không tải được danh sách.<br>
        ${error.message}
      </div>`;

  }

}


/* =========================================================
   REALTIME ROSTER
========================================================= */

db.ref("roster").on("value",snap=>{

  roster = snap.val() || {};

  render();

});


/* =========================================================
   REALTIME ĐIỂM DANH
========================================================= */

db.ref("attendance/" + todayKey()).on("value",snap=>{

  attendance = snap.val() || {};

  render();

});


/* =========================================================
   HIỂN THỊ
========================================================= */

function render(){

  const list = document.getElementById("list");

  const search =
    document.getElementById("search").value
    .trim()
    .toLowerCase();

  const arr = Object.entries(roster);

  let filtered = arr.filter(([key,item])=>{

    item = item || {};

    const text = [

      key,
      item.user,
      item.boss,
      item.name,
      item.province,
      item.store

    ].join(" ").toLowerCase();

    return text.includes(search);

  });


  filtered.sort((a,b)=>{

    const A = a[1] || {};
    const B = b[1] || {};

    return String(A.name || A.boss || "")
      .localeCompare(
        String(B.name || B.boss || ""),
        "vi"
      );

  });


  const total = arr.length;

  const checked =
    arr.filter(([key])=>attendance[key]).length;

  document.getElementById("count").textContent =
    `Tổng ${total} BOSS • Đã điểm danh ${checked}/${total}`;


  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">
        ${total ? "🔎 Không tìm thấy BOSS phù hợp." :
        "📋 Chưa có danh sách. ADMIN hãy nhập file Excel."}
      </div>`;

    return;

  }


  list.innerHTML = filtered.map(([key,item])=>{

    item = item || {};

    const data = attendance[key];

    const isChecked = !!data;

    const name =
      item.name ||
      item.boss ||
      item.user ||
      key;

    const user =
      item.user ||
      item.boss ||
      key;

    const province =
      item.province || "";

    const store =
      item.store || "";


    return `

      <div class="card ${isChecked ? "checked" : ""}">

        <div class="row">

          <div class="person">

            <div class="name">
              ${escapeHtml(name)}
            </div>

            <div class="user">
              USER: ${escapeHtml(user)}
            </div>

            <div class="store">
              🏪 ${escapeHtml(shortStore(store))}
            </div>

            ${
              province
              ?
              `<span class="province">
                ${escapeHtml(province)}
              </span>`
              :
              ""
            }

            ${
              isChecked
              ?
              `<div class="time">
                ✅ ${formatTime(data.time)}
              </div>`
              :
              ""
            }

          </div>


          <button
            class="check-btn ${isChecked ? "done" : ""}"
            ${isChecked ? "disabled" : ""}
            onclick="checkIn('${escapeAttr(key)}')"
          >
            ${isChecked ? "✓ ĐÃ ĐIỂM" : "ĐIỂM DANH"}
          </button>

        </div>


        ${
          admin
          ?
          `<div class="admin-actions">

            <button
              class="small-btn edit"
              onclick="editBoss('${escapeAttr(key)}')"
            >
              ✏ Sửa
            </button>

            <button
              class="small-btn delete"
              onclick="deleteBoss('${escapeAttr(key)}')"
            >
              🗑 Xóa
            </button>

          </div>`
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   RÚT GỌN SIÊU THỊ
========================================================= */

function shortStore(store){

  if(!store) return "";

  let s = String(store).trim();

  /*
    Ví dụ:
    976 - TGD_BLI_GRA - Hộ Phòng

    Hiển thị:
    976 - Hộ Phòng
  */

  const parts = s
    .split("-")
    .map(x=>x.trim())
    .filter(Boolean);

  if(parts.length >= 3){

    return parts[0] + " - " + parts[parts.length-1];

  }

  return s;

}


/* =========================================================
   CHECK IN
========================================================= */

async function checkIn(key){

  if(!auth.currentUser){

    alert("Đang kết nối hệ thống. Vui lòng thử lại.");

    return;

  }


  if(attendance[key]){

    alert("BOSS này đã điểm danh.");

    return;

  }


  const item = roster[key] || {};

  const data = {

    uid: auth.currentUser.uid,

    user:
      item.user ||
      item.boss ||
      key,

    name:
      item.name ||
      item.boss ||
      "",

    province:
      item.province ||
      "",

    store:
      item.store ||
      "",

    time: firebase.database.ServerValue.TIMESTAMP

  };


  try{

    await db.ref(
      "attendance/" + todayKey() + "/" + key
    ).set(data);

  }catch(error){

    console.error(error);

    alert(
      "❌ Điểm danh thất bại.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

function openAdmin(){

  if(admin){

    const panel =
      document.getElementById("adminPanel");

    panel.style.display =
      panel.style.display === "block"
      ? "none"
      : "block";

    return;

  }

  document.getElementById("loginModal").style.display =
    "flex";

  setTimeout(()=>{
    document.getElementById("adminPassword").focus();
  },100);

}


async function loginAdmin(){

  const password =
    document.getElementById("adminPassword").value;

  if(!password){

    alert("Vui lòng nhập mật khẩu.");

    return;

  }


  try{

    await auth.signInWithEmailAndPassword(
      ADMIN_EMAIL,
      password
    );

    closeModal("loginModal");

    document.getElementById("adminPassword").value = "";

    alert("✅ Đăng nhập ADMIN thành công.");

  }catch(error){

    console.error(error);

    alert(
      "❌ Sai mật khẩu hoặc tài khoản Admin chưa đúng."
    );

  }

}


/* =========================================================
   ADMIN UI
========================================================= */

function updateAdminUI(){

  const status =
    document.getElementById("adminStatus");

  const panel =
    document.getElementById("adminPanel");


  if(admin){

    status.innerHTML =
      `<span class="admin-on">ADMIN ĐANG ĐĂNG NHẬP</span>`;

    panel.style.display = "block";

  }else{

    status.innerHTML = "";

    panel.style.display = "none";

  }

  render();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutAdmin(){

  if(!confirm("Thoát quyền ADMIN?")) return;

  await auth.signOut();

}


/* =========================================================
   THÊM BOSS
========================================================= */

function openAdd(){

  if(!admin){

    alert("Chỉ ADMIN mới được thêm BOSS.");

    return;

  }

  currentEditKey = null;

  document.getElementById("bossModalTitle").textContent =
    "＋ THÊM BOSS";

  document.getElementById("bossId").value = "";
  document.getElementById("bossName").value = "";
  document.getElementById("bossProvince").value = "";
  document.getElementById("bossStore").value = "";

  document.getElementById("bossModal").style.display =
    "flex";

}


/* =========================================================
   SỬA BOSS
========================================================= */

function editBoss(key){

  if(!admin){

    alert("Chỉ ADMIN mới được chỉnh sửa.");

    return;

  }

  const item = roster[key] || {};

  currentEditKey = key;

  document.getElementById("bossModalTitle").textContent =
    "✏ SỬA BOSS";

  document.getElementById("bossId").value =
    item.user || item.boss || key;

  document.getElementById("bossName").value =
    item.name || "";

  document.getElementById("bossProvince").value =
    item.province || "";

  document.getElementById("bossStore").value =
    item.store || "";

  document.getElementById("bossModal").style.display =
    "flex";

}


/* =========================================================
   LƯU BOSS
========================================================= */

async function saveBoss(){

  if(!admin){

    alert("Chỉ ADMIN mới được chỉnh sửa.");

    return;

  }


  const user =
    document.getElementById("bossId").value.trim();

  const name =
    document.getElementById("bossName").value.trim();

  const province =
    document.getElementById("bossProvince").value.trim();

  const store =
    document.getElementById("bossStore").value.trim();


  if(!user){

    alert("Vui lòng nhập User / BOSS.");

    return;

  }


  const key =
    currentEditKey || makeKey(user);


  const data = {

    user:user,

    boss:user,

    name:name,

    province:province,

    store:store

  };


  try{

    await db.ref("roster/" + key).set(data);

    closeModal("bossModal");

    alert("✅ Đã lưu BOSS.");

  }catch(error){

    alert(
      "❌ Không thể lưu.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   XÓA BOSS
========================================================= */

async function deleteBoss(key){

  if(!admin){

    alert("Chỉ ADMIN mới được xóa.");

    return;

  }


  const item = roster[key] || {};

  const name =
    item.name ||
    item.user ||
    key;


  if(!confirm(
    "Xóa BOSS:\n\n" +
    name +
    "\n\nBạn chắc chắn?"
  )) return;


  try{

    await db.ref("roster/" + key).remove();

    alert("✅ Đã xóa.");

  }catch(error){

    alert(
      "❌ Không thể xóa.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   NHẬP EXCEL
========================================================= */

async function importExcel(event){

  if(!admin){

    alert("Chỉ ADMIN mới được nhập file.");

    event.target.value = "";

    return;

  }


  const file = event.target.files[0];

  if(!file) return;


  try{

    const data = await file.arrayBuffer();

    const workbook =
      XLSX.read(data,{type:"array"});

    const sheet =
      workbook.Sheets[workbook.SheetNames[0]];

    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          defval:"",
          raw:false
        }
      );


    if(!rows.length){

      alert("❌ File không có dữ liệu.");

      return;

    }


    let count = 0;

    const updates = {};


    rows.forEach(row=>{

      const normalized = {};

      Object.keys(row).forEach(k=>{

        normalized[
          String(k)
            .trim()
            .toLowerCase()
        ] = String(row[k] ?? "").trim();

      });


      const user =
        firstValue(normalized,[
          "user",
          "userid",
          "user id",
          "mã user",
          "mã nv",
          "boss",
          "bôss",
          "tài khoản"
        ]);


      const name =
        firstValue(normalized,[
          "tên",
          "name",
          "họ tên",
          "ho ten",
          "boss name"
        ]);


      const province =
        firstValue(normalized,[
          "tỉnh",
          "province",
          "khu vực"
        ]);


      const store =
        firstValue(normalized,[
          "siêu thị",
          "sieuthi",
          "siêu thị/cửa hàng",
          "cửa hàng",
          "store",
          "shop",
          "địa điểm"
        ]);


      /*
        Nếu cột User chứa:
        146155 - Đời

        thì tách User + Tên
      */

      let finalUser = user;
      let finalName = name;


      if(
        finalUser &&
        !finalName &&
        finalUser.includes(" - ")
      ){

        const parts =
          finalUser.split(" - ");

        finalUser = parts[0].trim();

        finalName =
          parts.slice(1).join(" - ").trim();

      }


      /*
        Nếu không tìm được User,
        thử tìm cột BOSS.
      */

      if(!finalUser){

        return;

      }


      const key =
        makeKey(finalUser);


      updates["roster/" + key] = {

        user:finalUser,

        boss:
          finalUser +
          (
            finalName
            ? " - " + finalName
            : ""
          ),

        name:finalName,

        province:province,

        store:store

      };


      count++;

    });


    if(!count){

      alert(
        "❌ Không tìm thấy cột User/BOSS trong file."
      );

      return;

    }


    await db.ref().update(updates);


    event.target.value = "";


    alert(
      "✅ Đã nhập " +
      count +
      " BOSS lên hệ thống."
    );


  }catch(error){

    console.error(error);

    alert(
      "❌ Lỗi nhập Excel.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   TÌM CỘT
========================================================= */

function firstValue(obj,keys){

  for(const key of keys){

    if(
      obj[key] !== undefined &&
      obj[key] !== null &&
      String(obj[key]).trim() !== ""
    ){

      return String(obj[key]).trim();

    }

  }

  return "";

}


/* =========================================================
   TẠO KEY FIREBASE
========================================================= */

function makeKey(text){

  return String(text)
    .trim()
    .replace(/[.#$[\]/]/g,"_")
    .replace(/\s+/g,"_");

}


/* =========================================================
   XUẤT EXCEL
========================================================= */

async function exportExcel(){

  if(!admin){

    alert("Chỉ ADMIN mới được xuất Excel.");

    return;

  }


  try{

    const snap =
      await db.ref("attendance").once("value");

    const all =
      snap.val() || {};


    const rows = [];


    Object.keys(all).forEach(date=>{

      const day =
        all[date] || {};


      Object.keys(day).forEach(key=>{

        const item =
          day[key] || {};

        const boss =
          roster[key] || {};


        rows.push({

          "Ngày":date,

          "Thời gian":formatTime(item.time),

          "User":
            item.user ||
            boss.user ||
            key,

          "Tên":
            item.name ||
            boss.name ||
            "",

          "Tỉnh":
            item.province ||
            boss.province ||
            "",

          "Siêu thị":
            shortStore(
              item.store ||
              boss.store ||
              ""
            ),

          "UID":
            item.uid ||
            ""

        });

      });

    });


    if(!rows.length){

      alert("Chưa có dữ liệu điểm danh.");

      return;

    }


    rows.sort((a,b)=>{

      return String(b["Thời gian"])
        .localeCompare(
          String(a["Thời gian"])
        );

    });


    const worksheet =
      XLSX.utils.json_to_sheet(rows);


    worksheet["!cols"] = [

      {wch:12},
      {wch:22},
      {wch:15},
      {wch:25},
      {wch:15},
      {wch:28},
      {wch:35}

    ];


    const workbook =
      XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "DiemDanh"
    );


    XLSX.writeFile(
      workbook,
      "DiemDanh_BOSS_TGDD.xlsx"
    );


  }catch(error){

    console.error(error);

    alert(
      "❌ Không xuất được Excel.\n\n" +
      error.message
    );

  }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}
