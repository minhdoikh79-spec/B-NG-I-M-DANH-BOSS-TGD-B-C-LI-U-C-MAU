<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Bảng Điểm Danh BOSS</title>

<!-- Đọc Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7fb;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Arial,sans-serif;
    color:#172033;
}

.app{
    max-width:980px;
    margin:auto;
    padding-bottom:40px;
}

/* ================= HEADER ================= */

.header{
    background:#ffd600;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:28px;
    font-weight:800;
}

.header p{
    margin:6px 0 0;
    font-size:16px;
    font-weight:700;
}

/* ================= CLOCK ================= */

.top{
    background:white;
    margin:14px 12px 0;
    padding:15px;
    border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
}

.clock{
    background:#eef2ff;
    color:#4f46e5;
    border:2px solid #dbe3ff;
    padding:8px 13px;
    border-radius:10px;
    font-size:20px;
    font-weight:800;
    font-family:monospace;
}

.adminBtn{
    border:2px solid #f59e0b;
    background:#fff7d6;
    color:#b45309;
    padding:10px 17px;
    border-radius:30px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

/* ================= BOX ================= */

.box{
    background:white;
    margin:14px 12px;
    padding:15px;
    border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
    font-size:19px;
    font-weight:800;
    margin-bottom:12px;
}

/* ================= BUTTON ================= */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    min-height:50px;
    padding:8px 10px;
    border-radius:12px;
    font-size:15px;
    font-weight:800;
}

.btn-primary{
    background:#4f46e5;
    color:white;
}

.btn-green{
    background:#10b981;
    color:white;
}

.btn-orange{
    background:#f59e0b;
    color:white;
}

.btn-gray{
    background:#eef2f7;
    color:#334155;
}

.btn-red{
    background:#ef4444;
    color:white;
}

/* ================= FILE ================= */

.fileBox{
    display:none;
    background:#f0fdf4;
    border:2px dashed #10b981;
    border-radius:15px;
    padding:14px;
    margin-top:12px;
}

.fileButton{
    display:block;
    text-align:center;
    background:#10b981;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

.fileButton input{
    display:none;
}

.fileNote{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-top:8px;
}

/* ================= SEARCH ================= */

.search{
    width:100%;
    padding:13px;
    border:2px solid #dbe3ef;
    border-radius:12px;
    font-size:16px;
    outline:none;
    margin-bottom:12px;
}

.search:focus{
    border-color:#6366f1;
}

/* ================= LIST ================= */

.listHeader{
    display:grid;
    grid-template-columns:55px 1fr 130px 150px;
    background:#eef3f9;
    padding:13px 8px;
    font-weight:800;
    color:#64748b;
    border-radius:12px 12px 0 0;
}

.boss{
    display:grid;
    grid-template-columns:55px 1fr 130px 150px;
    align-items:center;
    padding:10px 8px;
    border-bottom:1px solid #e2e8f0;
    gap:5px;
}

.boss:nth-child(even){
    background:#fbfdff;
}

.number{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#64748b;
}

.name{
    font-size:17px;
    font-weight:800;
}

.shop{
    color:#64748b;
    font-size:14px;
    margin-top:3px;
}

.checkBtn{
    width:100%;
    padding:10px 6px;
    border-radius:12px;
    font-size:14px;
    font-weight:800;
}

.notcheck{
    background:#f1f5f9;
    color:#64748b;
    border:2px solid #cbd5e1;
}

.checked{
    background:#ecfdf5;
    color:#047857;
    border:2px solid #10b981;
}

.time{
    text-align:center;
    color:#047857;
    background:#ecfdf5;
    border:2px solid #a7f3d0;
    padding:9px 5px;
    border-radius:12px;
    font-family:monospace;
    font-weight:800;
}

/* ================= ADMIN ================= */

.adminOnly{
    display:none;
}

.adminBadge{
    display:none;
    background:#fff7d6;
    color:#92400e;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:800;
}

.adminActions{
    display:flex;
    gap:5px;
    justify-content:flex-end;
}

.smallBtn{
    padding:7px 9px;
    border-radius:8px;
    font-weight:800;
    font-size:12px;
}

.edit{
    background:#dbeafe;
    color:#1d4ed8;
}

.delete{
    background:#fee2e2;
    color:#b91c1c;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.modalBox h2{
    margin-top:0;
}

.input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:2px solid #dbe3ef;
    border-radius:10px;
    font-size:16px;
}

.modalButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* ================= EMPTY ================= */

.empty{
    padding:35px 15px;
    text-align:center;
    color:#64748b;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header h1{
        font-size:22px;
    }

    .top{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        justify-content:center;
    }

    .clock{
        font-size:16px;
    }

    .adminBtn{
        font-size:14px;
    }

    .buttons{
        grid-template-columns:repeat(2,1fr);
    }

    .listHeader{
        grid-template-columns:40px 1fr 105px;
    }

    .listHeader div:nth-child(4){
        display:none;
    }

    .boss{
        grid-template-columns:40px 1fr 105px;
    }

    .time{
        grid-column:2 / 4;
        margin-top:3px;
    }

    .adminActions{
        margin-top:5px;
        justify-content:flex-start;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<div class="header">

    <h1>THẾ GIỚI DI ĐỘNG</h1>

    <p>HỘ PHÒNG • CHECK IN NHÂN SỰ</p>

</div>


<!-- ================= TOP ================= -->

<div class="top">

    <div class="logo">
        📋 Bảng Điểm Danh BOSS
    </div>

    <div class="clock" id="clock">
        00:00:00
    </div>

    <button class="adminBtn" onclick="loginAdmin()">
        👑 ADMIN
    </button>

</div>


<!-- ================= ADMIN ================= -->

<div class="box adminOnly" id="adminPanel">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
    ">

        <div class="title">
            👑 QUẢN TRỊ ADMIN
        </div>

        <span class="adminBadge" id="adminBadge">
            🔓 ADMIN ĐANG ĐĂNG NHẬP
        </span>

    </div>


    <div class="buttons">

        <button
            class="btn btn-green"
            onclick="openAdd()">
            ➕ Thêm Boss
        </button>

        <button
            class="btn btn-orange"
            onclick="document.getElementById('fileInput').click()">
            📂 Thêm File
        </button>

        <button
            class="btn btn-red"
            onclick="clearAll()">
            🗑️ Xóa Danh Sách
        </button>

        <button
            class="btn btn-gray"
            onclick="logoutAdmin()">
            🔒 Đăng Xuất
        </button>

    </div>


    <div class="fileBox" id="fileBox">

        <label class="fileButton">

            📂 CHỌN FILE DANH SÁCH

            <input
                type="file"
                id="fileInput"
                accept=".xlsx,.xls,.csv"
                onchange="importDanhSach(event)"
            >

        </label>

        <div class="fileNote">

            File Excel gồm 2 cột:
            <b>Tên</b> và <b>Siêu Thị</b>

            <br>

            Ví dụ:
            Hoa_7721 | Hộ Phòng

        </div>

    </div>

</div>


<!-- ================= DANH SÁCH ================= -->

<div class="box">

    <div class="title">
        📋 Danh Sách:
    </div>


    <div style="
        display:flex;
        gap:8px;
        margin-bottom:12px;
    ">

        <select
            id="shopFilter"
            class="search"
            style="margin:0;"
            onchange="render()">

            <option value="">
                🏪 Tất Cả Siêu Thị
            </option>

        </select>

    </div>


    <div class="buttons">

        <button
            class="btn btn-primary"
            onclick="checkAll()">
            ☑️ Check Tất Cả
        </button>

        <button
            class="btn btn-gray"
            onclick="uncheckAll()">
            🔄 Bỏ Check
        </button>

        <button
            class="btn btn-orange"
            onclick="copyUnchecked()">
            📋 Copy Tag Chưa Check
        </button>

        <button
            class="btn btn-green"
            onclick="copyChecked()">
            📋 Copy Tag Đã Check
        </button>

    </div>

</div>


<!-- ================= SEARCH ================= -->

<div class="box">

    <input
        id="search"
        class="search"
        placeholder="🔎 Tìm Boss hoặc Siêu Thị..."
        oninput="render()"
    >


    <div class="listHeader">

        <div>STT</div>

        <div>BOSS</div>

        <div>CHECK</div>

        <div>TIME</div>

    </div>


    <div id="bossList"></div>

</div>


<!-- ================= FOOTER ================= -->

<div style="
    text-align:center;
    color:#64748b;
    font-size:13px;
    padding:10px;
">

    Hệ thống Check In nhân sự

</div>

</div>


<!-- ================= MODAL ================= -->

<div class="modal" id="modal">

    <div class="modalBox">

        <h2 id="modalTitle">
            ➕ Thêm Boss
        </h2>

        <input
            id="nameInput"
            class="input"
            placeholder="Tên Boss"
        >

        <input
            id="shopInput"
            class="input"
            placeholder="Tên Siêu Thị"
        >

        <div class="modalButtons">

            <button
                class="btn btn-gray"
                onclick="closeModal()">
                Hủy
            </button>

            <button
                class="btn btn-primary"
                onclick="saveModal()">
                💾 Lưu
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CẤU HÌNH
===================================================== */

const ADMIN_PASSWORD = "146155";

let admin = false;

let editIndex = null;


/* =====================================================
   DỮ LIỆU
===================================================== */

let bosses = JSON.parse(
    localStorage.getItem("bossDanhSach") || "[]"
);


/* =====================================================
   TẠO DỮ LIỆU MẪU NẾU CHƯA CÓ
===================================================== */

if(bosses.length === 0){

    bosses = [

        {
            name:"Hoa_7721",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"An_59690",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Thi_51929",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Ngoan_21966",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Tâm_146168",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Phi_161470",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Sơn_7699",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Thảo_40924",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Nhẫn_7712",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        },

        {
            name:"Quy_63172",
            shop:"Hộ Phòng",
            checked:false,
            time:""
        }

    ];

    save();

}


/* =====================================================
   LƯU
===================================================== */

function save(){

    localStorage.setItem(
        "bossDanhSach",
        JSON.stringify(bosses)
    );

}


/* =====================================================
   ĐỒNG HỒ
===================================================== */

function updateClock(){

    const now = new Date();

    const h = String(now.getHours()).padStart(2,"0");

    const m = String(now.getMinutes()).padStart(2,"0");

    const s = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").textContent =
        h + ":" + m + ":" + s;

}

setInterval(updateClock,1000);

updateClock();


/* =====================================================
   ADMIN LOGIN
===================================================== */

function loginAdmin(){

    if(admin){

        alert("👑 Bạn đang đăng nhập ADMIN!");

        return;

    }

    const password = prompt(
        "🔐 NHẬP MẬT KHẨU ADMIN:"
    );

    if(password === ADMIN_PASSWORD){

        admin = true;

        document.getElementById(
            "adminPanel"
        ).style.display = "block";

        document.getElementById(
            "adminBadge"
        ).style.display = "inline-block";

        document.getElementById(
            "fileBox"
        ).style.display = "block";

        alert(
            "✅ ĐĂNG NHẬP ADMIN THÀNH CÔNG!"
        );

        render();

    }else{

        if(password !== null){

            alert(
                "❌ SAI MẬT KHẨU ADMIN!"
            );

        }

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin(){

    admin = false;

    document.getElementById(
        "adminPanel"
    ).style.display = "none";

    document.getElementById(
        "adminBadge"
    ).style.display = "none";

    document.getElementById(
        "fileBox"
    ).style.display = "none";

    render();

}


/* =====================================================
   HIỂN THỊ DANH SÁCH
===================================================== */

function render(){

    const container =
        document.getElementById("bossList");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const shop =
        document.getElementById("shopFilter")
        .value;

    const filtered = bosses.filter((boss)=>{

        const text =
            (boss.name + " " + boss.shop)
            .toLowerCase();

        const matchSearch =
            text.includes(search);

        const matchShop =
            !shop || boss.shop === shop;

        return matchSearch && matchShop;

    });


    /* ================= SHOP FILTER ================= */

    const shops = [
        ...new Set(
            bosses
            .map(x=>x.shop)
            .filter(x=>x)
        )
    ];

    const select =
        document.getElementById("shopFilter");

    const oldValue =
        select.value;

    select.innerHTML =
        '<option value="">🏪 Tất Cả Siêu Thị</option>';

    shops.forEach(shopName=>{

        const option =
            document.createElement("option");

        option.value = shopName;

        option.textContent =
            "🏪 " + shopName;

        select.appendChild(option);

    });

    if(shops.includes(oldValue)){

        select.value = oldValue;

    }


    /* ================= EMPTY ================= */

    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                📭 Chưa có Boss trong danh sách

                <br><br>

                ${
                    admin
                    ?
                    "👑 Admin có thể thêm Boss hoặc tải file Excel."
                    :
                    "Vui lòng liên hệ Admin."
                }

            </div>

        `;

        return;

    }


    /* ================= LIST ================= */

    container.innerHTML = "";


    filtered.forEach((boss)=>{

        const realIndex =
            bosses.indexOf(boss);

        const div =
            document.createElement("div");

        div.className = "boss";


        div.innerHTML = `

            <div class="number">
                ${realIndex + 1}
            </div>

            <div>

                <div class="name">
                    ${escapeHtml(boss.name)}
                </div>

                <div class="shop">
                    🏪 ${escapeHtml(boss.shop || "Chưa có")}
                </div>

                ${
                    admin
                    ?
                    `
                    <div class="adminActions">

                        <button
                            class="smallBtn edit"
                            onclick="openEdit(${realIndex})">
                            ✏️ Sửa
                        </button>

                        <button
                            class="smallBtn delete"
                            onclick="deleteBoss(${realIndex})">
                            🗑️ Xóa
                        </button>

                    </div>
                    `
                    :
                    ""
                }

            </div>


            <div>

                <button
                    class="checkBtn ${
                        boss.checked
                        ? "checked"
                        : "notcheck"
                    }"
                    onclick="toggleCheck(${realIndex})">

                    ${
                        boss.checked
                        ? "✅ Đã Check"
                        : "⚪ Chưa Check"
                    }

                </button>

            </div>


            <div class="time">

                ${
                    boss.time
                    ? boss.time
                    : "--:--:--"
                }

            </div>

        `;

        container.appendChild(div);

    });

}


/* =====================================================
   CHECK
===================================================== */

function toggleCheck(index){

    bosses[index].checked =
        !bosses[index].checked;


    if(bosses[index].checked){

        bosses[index].time =
            new Date().toLocaleTimeString(
                "vi-VN",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

    }else{

        bosses[index].time = "";

    }


    save();

    render();

}


/* =====================================================
   CHECK TẤT CẢ
===================================================== */

function checkAll(){

    const now =
        new Date().toLocaleTimeString(
            "vi-VN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    bosses.forEach(boss=>{

        boss.checked = true;

        if(!boss.time){

            boss.time = now;

        }

    });

    save();

    render();

}


/* =====================================================
   BỎ CHECK
===================================================== */

function uncheckAll(){

    bosses.forEach(boss=>{

        boss.checked = false;

        boss.time = "";

    });

    save();

    render();

}


/* =====================================================
   COPY CHƯA CHECK
===================================================== */

function copyUnchecked(){

    const text =
        bosses
        .filter(boss=>!boss.checked)
        .map(boss=>"@" + boss.name)
        .join(" ");


    if(!text){

        alert(
            "✅ Tất cả Boss đã Check!"
        );

        return;

    }


    copyText(text);

    alert(
        "📋 Đã Copy danh sách Boss chưa Check!"
    );

}


/* =====================================================
   COPY ĐÃ CHECK
===================================================== */

function copyChecked(){

    const text =
        bosses
        .filter(boss=>boss.checked)
        .map(boss=>"@" + boss.name)
        .join(" ");


    if(!text){

        alert(
            "📭 Chưa có Boss nào Check!"
        );

        return;

    }


    copyText(text);

    alert(
        "📋 Đã Copy danh sách Boss đã Check!"
    );

}


/* =====================================================
   COPY
===================================================== */

function copyText(text){

    navigator.clipboard
    .writeText(text)
    .catch(()=>{

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

    });

}


/* =====================================================
   THÊM BOSS
===================================================== */

function openAdd(){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được thêm Boss!"
        );

        return;

    }

    editIndex = null;

    document.getElementById(
        "modalTitle"
    ).textContent = "➕ Thêm Boss";

    document.getElementById(
        "nameInput"
    ).value = "";

    document.getElementById(
        "shopInput"
    ).value = "";

    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =====================================================
   SỬA BOSS
===================================================== */

function openEdit(index){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được chỉnh sửa Boss!"
        );

        return;

    }

    editIndex = index;

    document.getElementById(
        "modalTitle"
    ).textContent = "✏️ Sửa Boss";

    document.getElementById(
        "nameInput"
    ).value =
        bosses[index].name;

    document.getElementById(
        "shopInput"
    ).value =
        bosses[index].shop;

    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =====================================================
   LƯU MODAL
===================================================== */

function saveModal(){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được chỉnh sửa!"
        );

        return;

    }


    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    const shop =
        document.getElementById(
            "shopInput"
        ).value.trim();


    if(!name){

        alert(
            "⚠️ Vui lòng nhập Tên Boss!"
        );

        return;

    }


    if(editIndex === null){

        bosses.push({

            name:name,

            shop:shop,

            checked:false,

            time:""

        });

    }else{

        bosses[editIndex].name =
            name;

        bosses[editIndex].shop =
            shop;

    }


    save();

    closeModal();

    render();

}


/* =====================================================
   ĐÓNG MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =====================================================
   XÓA BOSS
===================================================== */

function deleteBoss(index){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được xóa Boss!"
        );

        return;

    }


    const ok =
        confirm(
            "🗑️ Bạn có chắc muốn xóa:\n\n" +
            bosses[index].name +
            "?"
        );


    if(!ok) return;


    bosses.splice(index,1);

    save();

    render();

}


/* =====================================================
   XÓA TOÀN BỘ
===================================================== */

function clearAll(){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được xóa danh sách!"
        );

        return;

    }


    const ok =
        confirm(
            "⚠️ CẢNH BÁO!\n\n" +
            "Bạn có chắc muốn xóa toàn bộ danh sách Boss?"
        );

    render();

/* =====================================================
   IMPORT EXCEL / CSV
===================================================== */

function importDanhSach(event){

    if(!admin){

        alert(
            "🔒 Chỉ ADMIN mới được thêm file!"
        );

        event.target.value = "";

        return;

    }


    const file =
        event.target.files[0];


    if(!file) return;


    const reader =
        new FileReader();


    reader.onload =
    function(e){

        try{

            const data =
                new Uint8Array(
                    e.target.result
                );


            const workbook =
                XLSX.read(
                    data,
                    {
                        type:"array"
                    }
                );


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            const rows =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval:""
                    }
                );


            if(!rows.length){

                alert(
                    "⚠️ File không có dữ liệu!"
                );

                return;

            }


            const danhSachMoi = [];


            rows.forEach(row=>{

                let name =
                    findColumn(
                        row,
                        [
                            "Tên",
                            "Tên Boss",
                            "Họ và tên",
                            "Ho va ten",
                            "Name",
                            "BOSS"
                        ]
                    );


                let shop =
                    findColumn(
                        row,
                        [
                            "Siêu Thị",
                            "Siêu thị",
                            "Sieu Thi",
                            "Shop",
                            "Cửa hàng",
                            "Cua hang"
                        ]
                    );


                name =
                    String(name || "")
                    .trim();


                shop =
                    String(shop || "")
                    .trim();


                if(name){

                    danhSachMoi.push({

                        name:name,

                        shop:shop,

                        checked:false,

                        time:""

                    });

                }

            });


            if(!danhSachMoi.length){

                alert(

                    "❌ KHÔNG TÌM THẤY DỮ LIỆU!\n\n" +

                    "File Excel cần có:\n" +

                    "Cột 1: Tên\n" +

                    "Cột 2: Siêu Thị"

                );

                return;

            }


            const replace =
                confirm(

                    "📂 Đã đọc được " +
                    danhSachMoi.length +
                    " Boss.\n\n" +

                    "OK = THAY THẾ danh sách hiện tại\n" +

                    "Cancel = THÊM vào danh sách hiện tại"

                );


            if(replace){

                bosses =
                    danhSachMoi;

            }else{

                bosses =
                    bosses.concat(
                        danhSachMoi
                    );

            }


            save();

            render();


            alert(

                "✅ NHẬP FILE THÀNH CÔNG!\n\n" +

                "Đã xử lý: " +
                danhSachMoi.length +
                " Boss."

            );


            event.target.value = "";


        }catch(error){

            console.error(error);


            alert(

                "❌ KHÔNG ĐỌC ĐƯỢC FILE!\n\n" +

                "Hãy kiểm tra lại file Excel."

            );

        }

    };


    reader.readAsArrayBuffer(file);

}


/* =====================================================
   TÌM CỘT EXCEL
===================================================== */

function findColumn(row,names){

    const keys =
        Object.keys(row);


    for(const name of names){

        const exact =
            keys.find(
                key =>
                    key.trim()
                    .toLowerCase()
                    ===
                    name.trim()
                    .toLowerCase()
            );


        if(exact){

            return row[exact];

        }

    }


    /* tìm gần đúng */

    for(const key of keys){

        const normalized =
            key
            .toLowerCase()
            .replace(/\s+/g,"")
            .replace(/đ/g,"d");


        for(const name of names){

            const target =
                name
                .toLowerCase()
                .replace(/\s+/g,"")
                .replace(/đ/g,"d");


            if(
                normalized.includes(target) ||
                target.includes(normalized)
            ){

                return row[key];

            }

        }

    }


    return "";

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

   CLICK RA NGOÀI MODAL
===================================================== */

document.getElementById("modal")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){

            closeModal();

        }

    }
);


/* =====================================================
   CHẠY
===================================================== */

render();
